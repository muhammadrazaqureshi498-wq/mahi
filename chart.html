<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gold Chart | Mahi Gold Rate</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="chart.css">

</head>

<body>

<div class="container">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="header-title">

            <h1>Gold Chart</h1>

            <p>Live International Gold Market</p>

        </div>

        <div class="live-dot">
            <span></span>
            LIVE
        </div>

    </header>


    <!-- ================= GOLD INFO ================= -->

    <section class="gold-info">

        <div class="gold-info-left">

            <div class="gold-icon">

                <i class="fa-solid fa-coins"></i>

            </div>

            <div>

                <h2>Gold</h2>

                <p>XAU / USD</p>

            </div>

        </div>


        <div class="market-status">

            <span></span>

            Market Data

        </div>

    </section>


    <!-- ================= TRADINGVIEW ================= -->

    <section class="chart-section">

        <div class="chart-header">

            <div>

                <h2>Gold Price</h2>

                <p>International XAU/USD</p>

            </div>

            <i class="fa-solid fa-chart-line"></i>

        </div>


        <div class="tradingview-widget-container">

            <div
                class="tradingview-widget-container__widget">
            </div>

            <script
                type="text/javascript"
                src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
                async>

            {
                "autosize": true,
                "symbol": "OANDA:XAUUSD",
                "interval": "60",
                "timezone": "Asia/Karachi",
                "theme": "dark",
                "style": "3",
                "locale": "en",
                "allow_symbol_change": true,
                "calendar": false,
                "support_host": "https://www.tradingview.com"
            }

            </script>

        </div>

    </section>


    <!-- ================= MARKET INFO ================= -->

    <section class="market-info">

        <div class="info-card">

            <div class="info-icon">
                <i class="fa-solid fa-globe"></i>
            </div>

            <div>

                <span>Market</span>

                <strong>XAU / USD</strong>

            </div>

        </div>


        <div class="info-card">

            <div class="info-icon">
                <i class="fa-solid fa-clock"></i>
            </div>

            <div>

                <span>Timezone</span>

                <strong>Pakistan</strong>

            </div>

        </div>


        <div class="info-card">

            <div class="info-icon">
                <i class="fa-solid fa-chart-line"></i>
            </div>

            <div>

                <span>Source</span>

                <strong>TradingView</strong>

            </div>

        </div>

    </section>


</div>


<!-- ================= BOTTOM NAVIGATION ================= -->

<nav class="bottom-nav">

    <a href="index.html" class="nav-item">

        <i class="fa-solid fa-house"></i>

        <span>Home</span>

    </a>


    <a href="calculator.html" class="nav-item">

        <i class="fa-solid fa-calculator"></i>

        <span>Calculator</span>

    </a>


    <a
        href="gold-rate-list.html"
        class="active"
    >

        <i class="fa-solid fa-list"></i>

        <span>Gold Rates</span>

    </a>


    <a href="chart.html" class="nav-item active">

        <i class="fa-solid fa-chart-line"></i>

        <span>Chart</span>

    </a>


    <a href="setting.html" class="nav-item">

        <i class="fa-solid fa-gear"></i>

        <span>Settings</span>

    </a>

</nav>


</body>

</html>
